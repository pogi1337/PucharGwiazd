<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puchar Gwiazd - Strona w przebudowie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #030712;
      --bg-card: rgba(15, 23, 42, 0.75);
      --navy-accent: #1e3a8a;
      --blue-glow: #3b82f6;
      --cyan-bright: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: rgba(59, 130, 246, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Tło z siatką i cząsteczkami */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Ambient Lighting */
    .ambient-glow {
      position: fixed;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(30, 58, 138, 0.4) 0%, rgba(3, 7, 18, 0) 70%);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      pointer-events: none;
      animation: pulse-glow 8s infinite alternate ease-in-out;
    }

    @keyframes pulse-glow {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
    }

    /* =========================================
       INTRO / LOADER OVERLAY
       ========================================= */
    #intro-loader {
      position: fixed;
      inset: 0;
      background-color: #020617;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
    }

    #intro-loader.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .loader-stage {
      position: relative;
      width: 320px;
      height: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .loader-logo-wrap {
      position: relative;
      z-index: 10;
      margin-bottom: 20px;
    }

    .loader-logo {
      width: 180px;
      height: auto;
      filter: drop-shadow(0 0 25px rgba(59, 130, 246, 0.6));
    }

    .loader-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
      position: relative;
      z-index: 10;
    }

    /* Piłki odbijające się w loaderze */
    .anim-ball {
      position: absolute;
      width: 38px;
      height: 38px;
      top: -80px;
      opacity: 0;
      z-index: 15;
    }

    /* Bounce 1: Piłka Nożna */
    .ball-football {
      left: calc(50% - 70px);
      animation: bounceFootball 1.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards 0.3s;
    }

    /* Bounce 2: Piłka Siatkowa */
    .ball-volleyball {
      left: calc(50% - 19px);
      animation: bounceVolleyball 1.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards 1.2s;
    }

    /* Bounce 3: Piłka Koszykowa */
    .ball-basketball {
      left: calc(50% + 32px);
      animation: bounceBasketball 1.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards 2.1s;
    }

    @keyframes bounceFootball {
      0% { top: -80px; opacity: 1; transform: rotate(0deg); }
      40% { top: 120px; transform: rotate(200deg) scaleY(0.85); } /* Odbicie od logo */
      60% { top: 40px; transform: rotate(300deg); }
      80% { top: 180px; transform: rotate(450deg) scaleY(0.8); } /* Odbicie od napisu */
      100% { top: 450px; opacity: 0; transform: rotate(600deg); }
    }

    @keyframes bounceVolleyball {
      0% { top: -80px; opacity: 1; transform: rotate(0deg); }
      40% { top: 110px; transform: rotate(-180deg) scaleY(0.85); }
      60% { top: 30px; transform: rotate(-280deg); }
      80% { top: 180px; transform: rotate(-400deg) scaleY(0.8); }
      100% { top: 450px; opacity: 0; transform: rotate(-520deg); }
    }

    @keyframes bounceBasketball {
      0% { top: -80px; opacity: 1; transform: rotate(0deg); }
      40% { top: 125px; transform: rotate(220deg) scaleY(0.85); }
      60% { top: 50px; transform: rotate(320deg); }
      80% { top: 180px; transform: rotate(480deg) scaleY(0.8); }
      100% { top: 450px; opacity: 0; transform: rotate(640deg); }
    }

    /* Animacja Lotki trafiającej w puchar */
    .anim-dart-hit {
      position: absolute;
      width: 50px;
      height: 50px;
      top: -100px;
      right: -80px;
      opacity: 0;
      z-index: 20;
      transform: rotate(-45deg);
      animation: dartFlyToTrophy 1.1s cubic-bezier(0.11, 0, 0.5, 1) forwards 3.6s;
    }

    @keyframes dartFlyToTrophy {
      0% {
        top: -100px;
        right: -80px;
        opacity: 0;
        transform: scale(1.8) rotate(-45deg);
      }
      70% {
        opacity: 1;
      }
      100% {
        top: 115px; /* trafienie w środek pucharów w logo */
        right: 135px;
        opacity: 1;
        transform: scale(0.9) rotate(-15deg);
      }
    }

    /* Rozbłysk po trafieniu */
    .trophy-flash {
      position: absolute;
      top: 115px;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 160px;
      height: 160px;
      background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(56,189,248,0.8) 40%, rgba(3,7,18,0) 80%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 25;
    }

    .trophy-flash.active {
      animation: flashBoom 0.6s ease-out forwards;
    }

    @keyframes flashBoom {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(2.5); opacity: 0.9; }
      100% { transform: translate(-50%, -50%) scale(4); opacity: 0; }
    }


    /* =========================================
       GŁÓWNA ZAWARTOŚĆ STRONY
       ========================================= */
    .main-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1100px;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Nagłówek z logo i indeksem */
    .header-section {
      text-align: center;
      margin-bottom: 3.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .main-logo-container {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .main-logo {
      width: 220px;
      height: auto;
      filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.5)) drop-shadow(0 0 20px rgba(59, 130, 246, 0.3));
      transition: transform 0.3s ease;
    }

    .main-logo:hover {
      transform: scale(1.03);
    }

    .main-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.8rem, 4vw, 3.2rem);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffffff 30%, #a5f3fc 70%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      margin-bottom: 0.8rem;
    }

    .sub-title-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(30, 58, 138, 0.4);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 50px;
      font-size: 0.9rem;
      color: var(--cyan-bright);
      font-weight: 600;
      letter-spacing: 1px;
      backdrop-filter: blur(10px);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--cyan-bright);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--cyan-bright);
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* Grid z dwiema sekcjami */
    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2.5rem;
      width: 100%;
    }

    /* Karty Wydarzeń */
    .event-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: transform 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
      overflow: hidden;
    }

    .event-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, transparent, var(--blue-glow), transparent);
      opacity: 0.5;
      transition: opacity 0.4s ease;
    }

    .event-card:hover {
      transform: translateY(-8px);
      border-color: rgba(56, 189, 248, 0.5);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 30px rgba(59, 130, 246, 0.2);
    }

    .event-card:hover::before {
      opacity: 1;
    }

    .card-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Kontener dla animacji SVG */
    .anim-container {
      width: 100%;
      height: 180px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    /* Countdown Styles */
    .timer-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .target-date-label {
      font-size: 0.85rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .target-date-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--cyan-bright);
      margin-bottom: 1.2rem;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    .countdown-boxes {
      display: flex;
      gap: 10px;
      justify-content: center;
      width: 100%;
    }

    .c-box {
      background: rgba(3, 7, 18, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 10px 12px;
      min-width: 65px;
      text-align: center;
    }

    .c-val {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: #ffffff;
      display: block;
    }

    .c-lbl {
      font-size: 0.65rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    /* ANIMACJE W KARTACH */
    /* 1. DART ANIMATION */
    .dart-board-svg {
      width: 140px;
      height: 140px;
    }

    .dart-arrow-svg {
      position: absolute;
      width: 55px;
      height: 55px;
      top: 15px;
      right: 15px;
      animation: throwDart 3s infinite cubic-bezier(0.25, 1, 0.5, 1);
    }

    @keyframes throwDart {
      0% { transform: translate(60px, -60px) scale(1.4) rotate(-30deg); opacity: 0; }
      20% { opacity: 1; }
      45%, 85% { transform: translate(-42px, 42px) scale(1) rotate(-10deg); opacity: 1; }
      100% { transform: translate(-42px, 42px) scale(1) rotate(-10deg); opacity: 0; }
    }

    .dart-target-shockwave {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--cyan-bright);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      pointer-events: none;
      animation: shockwave 3s infinite cubic-bezier(0.1, 0.8, 0.3, 1);
    }

    @keyframes shockwave {
      0%, 42% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      46% { opacity: 1; }
      70% { transform: translate(-50%, -50%) scale(5); opacity: 0; }
      100% { opacity: 0; }
    }

    /* 2. KOSZYKÓWKA ANIMATION */
    .basketball-hoop-svg {
      width: 140px;
      height: 140px;
    }

    .basketball-ball-svg {
      position: absolute;
      width: 38px;
      height: 38px;
      animation: shootBasketball 3.5s infinite cubic-bezier(0.45, 0.05, 0.55, 0.95);
    }

    @keyframes shootBasketball {
      0% { transform: translate(-100px, 60px) scale(0.7) rotate(0deg); opacity: 0; }
      15% { opacity: 1; }
      45% { transform: translate(-5px, -65px) scale(1.1) rotate(260deg); }
      60% { transform: translate(22px, -10px) scale(0.9) rotate(420deg); }
      75%, 88% { transform: translate(22px, 50px) scale(0.85) rotate(540deg); opacity: 1; }
      100% { transform: translate(22px, 80px) scale(0.8) rotate(600deg); opacity: 0; }
    }

    .net-swish {
      transform-origin: top center;
      animation: netMove 3.5s infinite ease-in-out;
    }

    @keyframes netMove {
      0%, 55% { transform: scale1(1) skewX(0deg); }
      60% { transform: scaleY(1.25) skewX(6deg); }
      68% { transform: scaleY(0.9) skewX(-4deg); }
      75% { transform: scaleY(1.05) skewX(2deg); }
      85%, 100% { transform: scale(1) skewX(0deg); }
    }

    /* Stopka */
    footer {
      margin-top: 4rem;
      font-size: 0.85rem;
      color: var(--text-sub);
      text-align: center;
      letter-spacing: 1px;
    }

    /* Responsywność */
    @media (max-width: 640px) {
      .main-title { font-size: 1.6rem; }
      .events-grid { grid-template-columns: 1fr; }
      .c-box { min-width: 55px; padding: 8px 6px; }
      .c-val { font-size: 1.1rem; }
      .loader-logo { width: 140px; }
      .loader-text { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

  <!-- TŁO Z KANWĄ DLA CZĄSTECZEK -->
  <canvas id="bg-canvas"></canvas>
  <div class="ambient-glow"></div>

  <!-- =========================================
       EKRAN ŁADOWANIA (INTRO LOADER)
       ========================================= -->
  <div id="intro-loader">
    <div class="loader-stage">
      
      <!-- LOGO W LOADERZE -->
      <div class="loader-logo-wrap">
        <img class="loader-logo" src="data:image/png;base64,iVBORw0KGgoAAAANSU6BAAAAAA..." alt="Puchar Gwiazd Logo">
      </div>

      <!-- NAPIS DLA ODBIĆ -->
      <div class="loader-text" id="loader-title-text">PUCHAR GWIAZD</div>

      <!-- BŁYSK PO TRAFIENIU LOTKĄ -->
      <div class="trophy-flash" id="flash-effect"></div>

      <!-- ANIMOWANE PIŁKI (SPADAJĄCE I ODBIJAJĄCE SIĘ) -->
      <!-- 1. Piłka Nożna -->
      <svg class="anim-ball ball-football" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="46" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
        <polygon points="50,25 30,38 37,62 63,62 70,38" fill="#0f172a"/>
        <line x1="50" y1="25" x2="50" y2="6" stroke="#0f172a" stroke-width="3"/>
        <line x1="30" y1="38" x2="11" y2="30" stroke="#0f172a" stroke-width="3"/>
        <line x1="37" y1="62" x2="22" y2="80" stroke="#0f172a" stroke-width="3"/>
        <line x1="63" y1="62" x2="78" y2="80" stroke="#0f172a" stroke-width="3"/>
        <line x1="70" y1="38" x2="89" y2="30" stroke="#0f172a" stroke-width="3"/>
      </svg>

      <!-- 2. Piłka Siatkowa -->
      <svg class="anim-ball ball-volleyball" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="46" fill="#f8fafc" stroke="#1e3a8a" stroke-width="4"/>
        <path d="M50 4 A46 46 0 0 1 96 50 A46 46 0 0 1 50 96 A46 46 0 0 1 4 50 A46 46 0 0 1 50 4 Z" fill="none" stroke="#1e3a8a" stroke-width="3"/>
        <path d="M20 15 C 40 35, 60 35, 80 15" fill="none" stroke="#2563eb" stroke-width="3.5"/>
        <path d="M15 80 C 35 60, 35 40, 15 20" fill="none" stroke="#2563eb" stroke-width="3.5"/>
        <path d="M80 85 C 60 65, 60 45, 85 20" fill="none" stroke="#2563eb" stroke-width="3.5"/>
      </svg>

      <!-- 3. Piłka Koszykowa -->
      <svg class="anim-ball ball-basketball" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="46" fill="#3b82f6" stroke="#0f172a" stroke-width="4"/>
        <line x1="4" y1="50" x2="96" y2="50" stroke="#0f172a" stroke-width="3.5"/>
        <line x1="50" y1="4" x2="50" y2="96" stroke="#0f172a" stroke-width="3.5"/>
        <path d="M 20,8 A 46,46 0 0,1 20,92" fill="none" stroke="#0f172a" stroke-width="3.5"/>
        <path d="M 80,8 A 46,46 0 0,0 80,92" fill="none" stroke="#0f172a" stroke-width="3.5"/>
      </svg>

      <!-- LOTKA DART TRAFIAJĄCA W PUCHAR -->
      <svg class="anim-dart-hit" viewBox="0 0 100 100">
        <path d="M 15 85 L 35 65 L 25 55 Z" fill="#2563eb"/>
        <path d="M 15 85 L 35 65 L 45 75 Z" fill="#1d4ed8"/>
        <path d="M 15 85 L 5 65 L 25 55 Z" fill="#3b82f6"/>
        <path d="M 15 85 L 65 35" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
        <path d="M 60 40 L 75 25 L 65 15 L 50 30 Z" fill="#f8fafc"/>
        <polygon points="75,25 95,5 85,25" fill="#ef4444"/>
        <polygon points="75,25 95,5 75,15" fill="#dc2626"/>
      </svg>

    </div>
  </div>


  <!-- =========================================
       GŁÓWNA STRONA W PRZEBUDOWIE
       ========================================= -->
  <main class="main-container">
    
    <!-- NAGŁÓWEK Z LOGO -->
    <header class="header-section">
      <div class="main-logo-container">
        <img class="main-logo" src="data:image/png;base64,iVBORw0KGgoAAAANSU6BAAAAAA..." alt="Puchar Gwiazd Logo">
      </div>
      <h1 class="main-title">STRONA W TRAKCIE PRZEBUDOWY</h1>
      <div class="sub-title-badge">
        <span class="pulse-dot"></span>
        SZYKUJEMY NOWĄ EDYCJĘ TURNIEJÓW
      </div>
    </header>

    <!-- GRID Z WYDARZENIAMI (DART & KOSZYKÓWKA) -->
    <section class="events-grid">

      <!-- KARTA 1: DART -->
      <article class="event-card">
        <h2 class="card-title">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
          TURNIEJ DART
        </h2>

        <!-- Animacja Darta -->
        <div class="anim-container">
          <div class="dart-target-shockwave"></div>
          
          <!-- Tarcza SVG -->
          <svg class="dart-board-svg" viewBox="0 0 200 200">
            <circle cx="100" cy="100" r="95" fill="#0b132b" stroke="#38bdf8" stroke-width="4"/>
            <circle cx="100" cy="100" r="80" fill="none" stroke="#1e3a8a" stroke-width="12"/>
            <circle cx="100" cy="100" r="50" fill="none" stroke="#1d4ed8" stroke-width="10"/>
            <circle cx="100" cy="100" r="25" fill="#020617" stroke="#38bdf8" stroke-width="3"/>
            <circle cx="100" cy="100" r="8" fill="#ef4444"/>
            <!-- Linie tarczy -->
            <line x1="100" y1="5" x2="100" y2="195" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
            <line x1="5" y1="100" x2="195" y2="100" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
            <line x1="33" y1="33" x2="167" y2="167" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
            <line x1="33" y1="167" x2="167" y2="33" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
          </svg>

          <!-- Lotka SVG -->
          <svg class="dart-arrow-svg" viewBox="0 0 100 100">
            <path d="M 20 80 L 40 60 L 30 50 Z" fill="#2563eb"/>
            <path d="M 20 80 L 40 60 L 50 70 Z" fill="#1d4ed8"/>
            <path d="M 20 80 L 70 30" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
            <path d="M 65 35 L 80 20 L 70 10 L 55 25 Z" fill="#ffffff"/>
            <polygon points="80,20 100,0 90,20" fill="#38bdf8"/>
            <polygon points="80,20 100,0 80,10" fill="#1d4ed8"/>
          </svg>
        </div>

        <!-- Odliczanie Dart -->
        <div class="timer-wrap">
          <span class="target-date-label">DATA WYDARZENIA</span>
          <div class="target-date-value">18.10.2026</div>
          <div class="countdown-boxes" id="cd-dart">
            <div class="c-box"><span class="c-val" id="dart-days">00</span><span class="c-lbl">Dni</span></div>

      }

        document.getElementById('bball-secs').innerText = String(Math.floor((diffBball % (1000 * 60)) / 1000)).padStart(2, '0');
      }
    }

    setInterval(updateCountdowns, 1000);
